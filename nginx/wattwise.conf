# nginx/wattwise.conf
# TLS-terminating reverse proxy in front of both services. Replace
# certs/wattwise.crt and certs/wattwise.key with a real certificate
# (Let's Encrypt via certbot, or your org's CA) before going live —
# these paths are placeholders, not generated by this config.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wattwise.crt;
    ssl_certificate_key /etc/nginx/certs/wattwise.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 55M;  # slightly above MAX_UPLOAD_SIZE_MB in data_loader.py

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://dashboard:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";  # Streamlit needs websocket upgrade
    }
}
